<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>复制隐藏链接</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 50px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>点击按钮自动复制下载链接，打开浏览器粘贴打开即可下载</h2>
    <button id="copyBtn">📋 复制链接</button>
    <p id="message"></p>

    <script>
        document.getElementById("copyBtn").addEventListener("click", async function () {
            let hiddenLink = "http://ertmxym5zdnh.s3-website-us-west-1.amazonaws.com/HZCF/HZCF.stb"; // 这里填写你的目标链接（不会显示在页面上）
            
            try {
                await navigator.clipboard.writeText(hiddenLink); // 复制到剪贴板
                document.getElementById("message").innerText = "✅ 链接已复制！";
            } catch (err) {
                document.getElementById("message").innerText = "❌ 复制失败，请手动复制！";
            }
        });
    </script>

</body>
</html>
